<!--
  File      : templates/stock-table.html
  Template  : tpl-stock (komponen <ba-stock-table>)
  Indikator : 1.2 v-for + filter, 1.3 empty state & dependent filter,
              1.4 tabel hasil computed, 1.6 event hover tooltip & tombol aksi
-->
<script type="text/x-template" id="tpl-stock">
  <section class="page">
    <header class="page__head">
      <div>
        <h1>Stok Bahan Ajar</h1>
        <p class="muted">Pantau stok per UT-Daerah, cek status, dan kelola data bahan ajar.</p>
      </div>
      <button type="button" class="btn btn--primary" @click="toggleForm">
        {{ formOpen ? 'Tutup Form' : '+ Tambah Bahan Ajar' }}
      </button>
    </header>

    <!-- Form create/update: satu komponen, mode ditentukan prop item -->
    <ba-order-form
      v-show="formOpen"
      ref="form"
      :item="editingItem"
      :kategori-list="kategoriList"
      :upbjj-list="upbjjList"
      @save="handleSave"
      @cancel="closeForm">
    </ba-order-form>

    <div class="card">
      <div class="toolbar">
        <label class="field field--inline">
          <span class="field__label">UT-Daerah</span>
          <select class="input" v-model="filterUpbjj">
            <option value="Semua">Semua</option>
            <option v-for="u in upbjjList" :key="u" :value="u">{{ u }}</option>
          </select>
        </label>

        <!-- Dependent filter: pilihan kategori mengikuti UT-Daerah -->
        <label class="field field--inline" v-if="filterUpbjj !== ''">
          <span class="field__label">Kategori</span>
          <select class="input" v-model="filterKategori" :disabled="!kategoriOptions.length">
            <option value="Semua">Semua</option>
            <option v-for="k in kategoriOptions" :key="k" :value="k">{{ k }}</option>
          </select>
        </label>

        <label class="checkbox">
          <input type="checkbox" v-model="onlyReorder">
          <span>Hanya stok perlu re-order ({{ jumlahReorder }})</span>
        </label>

        <label class="field field--inline">
          <span class="field__label">Urutkan</span>
          <select class="input" v-model="sortBy">
            <option value="judul">Judul (A–Z)</option>
            <option value="qty">Qty (kecil → besar)</option>
            <option value="harga">Harga (kecil → besar)</option>
          </select>
        </label>

        <button type="button" class="btn btn--ghost" @click="resetFilter">Reset Filter</button>
      </div>

      <p class="result-info">
        Menampilkan <strong>{{ sortedStok.length }}</strong> dari <strong>{{ stok.length }}</strong> bahan ajar.
        <span class="muted">Arahkan kursor ke badge status untuk melihat catatan stok.</span>
      </p>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Kode MK / Nama MK</th>
              <th>Kategori</th>
              <th>UT-Daerah</th>
              <th>Lokasi Rak</th>
              <th class="num">Harga</th>
              <th class="num">Jumlah Stok</th>
              <th class="num">Safety Stok</th>
              <th>Status</th>
              <th class="num">Aksi</th>
            </tr>
          </thead>
          <tbody>
            <tr v-if="sortedStok.length === 0">
              <td colspan="9" class="empty-cell">
                <template v-if="stok.length === 0">
                  Belum ada bahan ajar. Klik <strong>“+ Tambah Bahan Ajar”</strong> untuk mulai.
                </template>
                <template v-else>
                  Tidak ada bahan ajar yang cocok dengan filter saat ini.
                </template>
              </td>
            </tr>

            <tr
              v-for="item in sortedStok"
              :key="item.kode"
              :class="{ 'row--warn': statusStok(item) === 'Menipis', 'row--danger': statusStok(item) === 'Kosong' }">
              <td><strong class="mono">{{ item.kode }}</strong> — {{ item.judul }}</td>
              <td>{{ item.kategori }}</td>
              <td>{{ item.upbjj }}</td>
              <td class="mono">{{ item.lokasiRak }}</td>
              <td class="num">{{ item.harga | currency }}</td>
              <td class="num">{{ item.qty | satuan }}</td>
              <td class="num">{{ item.safety | satuan }}</td>
              <td>
                <div
                  class="cell-status"
                  @mouseenter="showTooltip(item, $event)"
                  @mouseleave="hideTooltip">
                  <ba-status-badge :qty="item.qty" :safety="item.safety"></ba-status-badge>
                </div>
              </td>
              <td class="num cell-actions">
                <button type="button" class="btn btn--sm" @click="openEdit(item)">Edit</button>
                <button type="button" class="btn btn--sm btn--danger-ghost" @click="openModal(item)">Hapus</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Tooltip catatan stok: HTML dirender dengan v-html -->
    <div
      class="tooltip"
      v-show="tooltip.show"
      :style="{ top: tooltip.y + 'px', left: tooltip.x + 'px' }"
      v-html="tooltip.html">
    </div>

    <!-- Konfirmasi hapus -->
    <app-modal
      :show="deleteTarget !== null"
      title="Hapus Bahan Ajar"
      confirm-label="Ya, Hapus"
      cancel-label="Batal"
      :danger="true"
      @confirm="confirmDelete"
      @close="cancelDelete">
      <p v-if="deleteTarget">
        Hapus <strong>{{ deleteTarget.kode }} — {{ deleteTarget.judul }}</strong>
        dari stok {{ deleteTarget.upbjj }}? Tindakan ini tidak dapat dibatalkan.
      </p>
    </app-modal>
  </section>
</script>
