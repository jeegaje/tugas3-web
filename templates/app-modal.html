<!--
  File      : templates/app-modal.html
  Template  : tpl-modal (komponen <app-modal>)
  Indikator : 1.1 slot/props/$emit, 1.7 UI modal konsisten
-->
<script type="text/x-template" id="tpl-modal">
  <div class="modal-overlay" v-show="show" @click.self="$emit('close')">
    <div class="modal" role="dialog" aria-modal="true" :aria-label="title">
      <h3 class="modal__title">{{ title }}</h3>

      <div class="modal__body">
        <slot></slot>
      </div>

      <div class="modal__footer">
        <button type="button" class="btn btn--ghost" @click="$emit('close')">{{ cancelLabel }}</button>
        <button
          type="button"
          class="btn"
          :class="danger ? 'btn--danger' : 'btn--primary'"
          @click="$emit('confirm')">
          {{ confirmLabel }}
        </button>
      </div>
    </div>
  </div>
</script>
